# Manual baseline: upstream netbrain/zwift, native QZ on the host.
NETWORKING="host"
CONTAINER_TOOL="podman"
PRIVILEGED_CONTAINER="0"

# NVIDIA Container Toolkit CDI supplies the GPU and matching drivers.
VGA_DEVICE_FLAG=(--device=nvidia.com/gpu=all)
CONTAINER_EXTRA_ARGS=(
  --env=__NV_PRIME_RENDER_OFFLOAD=1
  --env=__GLX_VENDOR_LIBRARY_NAME=nvidia
  --env=__VK_LAYER_NV_optimus=NVIDIA_only
)

# Keep the inspected launcher revision and preserve existing images.
SCRIPT_VERSION="26ca0daa3af49e670d40811deaa4673d4a4ee9eb"
DONT_CLEAN="1"
